<svg xmlns="http://www.w3.org/2000/svg" width="520" height="104" viewBox="0 0 520 104" role="img" aria-labelledby="title desc">
  <title id="title">Follow qizong007 on YouTube</title>
  <desc id="desc">A red grid card linking to the qizong007 YouTube channel.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".58" stop-color="#FFF8F8"/>
      <stop offset="1" stop-color="#F5E7E7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF0000" stop-opacity=".22"/>
      <stop offset=".58" stop-color="#FFD0D0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#111111"/>
      <stop offset=".7" stop-color="#FF0000"/>
      <stop offset="1" stop-color="#FF0000" stop-opacity=".1"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#401010" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="frame">
      <rect width="520" height="104" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="520" height="104" fill="url(#surface)"/>
    <rect width="520" height="104" fill="url(#grid)"/>
    <ellipse cx="449" cy="52" rx="108" ry="92" fill="url(#glow)"/>

    <g transform="translate(31 19)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text x="0" y="12" fill="#695959" font-size="9" font-weight="750" letter-spacing="2.2">FOLLOW THE MAKER</text>
      <text x="0" y="48" fill="#0A0A0A" font-size="27" font-weight="800" letter-spacing="-.7">@qizong007</text>
      <path d="M0 61H316" stroke="url(#rule)" stroke-width="1"/>
      <text x="0" y="75" fill="#806A6A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="650" letter-spacing="1.05">YOUTUBE.COM / @QIZONG007</text>
    </g>

    <g transform="translate(411)">
      <rect x="17" y="27" width="66" height="48" rx="14" fill="#FF0000"/>
      <path d="m45 40 18 11-18 11z" fill="#FFFFFF"/>
      <path d="M7 14h10M7 14v10M100 90H90M100 90V80" fill="none" stroke="#FF0000" stroke-width="1" opacity=".65"/>
    </g>
  </g>

  <rect x=".5" y=".5" width="519" height="103" rx="13.5" fill="none" stroke="#D5B8B8"/>
</svg>
