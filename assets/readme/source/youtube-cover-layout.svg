<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1280" height="720" viewBox="0 0 1280 720"
     role="img" aria-labelledby="title desc">
  <title id="title">一张封面，搞定全平台</title>
  <desc id="desc">基于用户照片重构的 16:9 YouTube 风封面示例。</desc>

  <defs>
    <linearGradient id="title-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07101E" stop-opacity="0.98"/>
      <stop offset="0.45" stop-color="#0D1424" stop-opacity="0.9"/>
      <stop offset="0.72" stop-color="#0D1424" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0D1424" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottom-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#07101E" stop-opacity="0"/>
      <stop offset="1" stop-color="#07101E" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <image width="1280" height="720" xlink:href="youtube-cover-art.png"
         preserveAspectRatio="xMidYMid slice"/>
  <rect width="900" height="720" fill="url(#title-shade)"/>
  <rect width="1280" height="720" fill="url(#bottom-shade)"/>
  <rect x="12" y="12" width="1256" height="696" rx="24" fill="none" stroke="#59D8E6" stroke-width="4"/>

  <g id="copy" transform="translate(72 68)"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g>
      <rect width="220" height="48" rx="12" fill="#FF6B57"/>
      <text x="22" y="33" fill="#0D1424" font-size="23" font-weight="760" letter-spacing="1">AI 封面工作流</text>
    </g>

    <text x="0" y="190" fill="#F6F2E8" font-size="88" font-weight="820" letter-spacing="-2">一张封面</text>
    <text x="0" y="296" fill="#59D8E6" font-size="88" font-weight="820" letter-spacing="-2">搞定全平台</text>
    <rect x="0" y="328" width="492" height="8" rx="4" fill="#FF6B57"/>

    <g transform="translate(0 382)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect width="82" height="52" rx="10" fill="#F6F2E8"/>
      <rect x="92" width="82" height="52" rx="10" fill="#F6F2E8"/>
      <rect x="184" width="82" height="52" rx="10" fill="#F6F2E8"/>
      <rect x="276" width="94" height="52" rx="10" fill="#F6F2E8"/>
      <rect x="380" width="126" height="52" rx="10" fill="#F6F2E8"/>
      <text x="20" y="35" fill="#0D1424" font-size="22" font-weight="700">1:1</text>
      <text x="112" y="35" fill="#0D1424" font-size="22" font-weight="700">3:4</text>
      <text x="204" y="35" fill="#0D1424" font-size="22" font-weight="700">4:3</text>
      <text x="292" y="35" fill="#0D1424" font-size="22" font-weight="700">16:9</text>
      <text x="394" y="35" fill="#0D1424" font-size="22" font-weight="700">2.35:1</text>
    </g>

    <text x="0" y="524" fill="#AAB8CF" font-size="21" font-weight="600" letter-spacing="1.4">RECOMPOSE · DON'T STRETCH</text>
  </g>

  <g id="crop-marks" stroke="#FF6B57" stroke-width="6" fill="none">
    <path d="M34 88 V34 H88"/>
    <path d="M1192 34 H1246 V88"/>
    <path d="M34 632 V686 H88"/>
    <path d="M1192 686 H1246 V632"/>
  </g>
</svg>
